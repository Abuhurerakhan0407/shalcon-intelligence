name: Portfolio Build Check

on:
  push:
    branches: [portfolio-final-2026]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Install viewport QA driver
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Run responsive viewport QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          node scripts/viewport-qa.mjs
          kill $PREVIEW_PID || true
      - name: Upload production build and QA captures
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: |
            dist
            qa
          retention-days: 1
      - name: Publish production dist branch
        if: github.event_name == 'push'
        run: |
          cp -R dist /tmp/abu-portfolio-2-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan abu-portfolio-2-dist
          git rm -rf .
          cp -R /tmp/abu-portfolio-2-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish Abu Portfolio 2 dist"
          git push origin HEAD:abu-portfolio-2-dist --force
