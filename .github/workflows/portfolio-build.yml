name: Portfolio Build Check

on:
  push:
    branches: [portfolio-final-2026]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
          retention-days: 1
