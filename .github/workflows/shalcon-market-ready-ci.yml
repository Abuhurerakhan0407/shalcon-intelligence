name: Shalcon Market Ready CI

on:
  push:
    branches: [shalcon-market-ready-2026]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: shalcon-npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Security audit gate
        run: npm audit --audit-level=moderate

      - name: Marketing claim regression guard
        run: node scripts/verify-marketing-claims.mjs

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shalcon-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
