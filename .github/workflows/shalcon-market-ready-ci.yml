name: Shalcon Market Ready CI

on:
  push:
    branches: [shalcon-market-ready-2026]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Marketing claim regression guard
        run: node scripts/verify-marketing-claims.mjs

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html
