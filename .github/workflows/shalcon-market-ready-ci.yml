name: Shalcon Market Ready CI

on:
  push:
    branches: [shalcon-market-ready-2026]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: shalcon-market-ready-2026

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh trimmed lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist trimmed lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock trimmed runtime dependency graph [skip ci]"
            git push origin HEAD:shalcon-market-ready-2026
          fi

      - name: Install dependencies
        run: npm ci

      - name: Capture dependency audit
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: shalcon-npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Security audit gate
        run: npm audit --audit-level=moderate

      - name: Runtime dependency usage guard
        run: node scripts/verify-runtime-deps.mjs

      - name: Marketing claim regression guard
        run: node scripts/verify-marketing-claims.mjs

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shalcon-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
